# Prueba de reproducibilidad: en cada push y pull request, GitHub arma una
# máquina limpia, clona el repo, instala requirements.txt y corre las pruebas.
# No usa ninguna clave: todas las pruebas trabajan con el proveedor simulado.
name: pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Correr las pruebas (sin clave)
        run: python -m pytest -q
      - name: Corrida completa en modo simulado
        run: python -m scripts.corrida --simulado invalido_luego_valido
      - name: Ingesta de documentos (embeddings simulados, sin descarga)
        run: python -m src.rag.ingestar --simulado
      - name: Corrida de la PE3 en modo simulado
        run: python -m scripts.corrida_pe3 --simulado rag_valido --embeddings-simulados --pausa 0
      - name: Script cliente del servidor MCP
        run: python -m scripts.cliente_mcp
      - name: Corrida de la PE4 en modo simulado (5 conversaciones y retomada en otro proceso)
        run: python -m scripts.corrida_pe4 --simulado
      - name: Correcciones de la devolución de la PE3 en modo simulado (seguridad y top-k)
        run: python -m scripts.corrida_correcciones_pe3 --simulado
